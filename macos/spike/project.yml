# XcodeGen spec: `xcodegen generate` writes R2FLSpike.xcodeproj (not checked in).
# No team, no profile, no signing identity: ad hoc ("Sign to Run Locally") by default.
name: R2FLSpike
options:
  bundleIdPrefix: dev.r2fastlink
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  R2FLSpike:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ['Info.plist']
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: r2-fastlink # the name notifications show
        PRODUCT_MODULE_NAME: R2FLSpike
        PRODUCT_BUNDLE_IDENTIFIER: dev.r2fastlink.spike
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: R2FLFinderSync # embedded in Contents/PlugIns
  R2FLFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExt
        excludes: ['Info.plist', '*.entitlements']
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: R2FLFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: dev.r2fastlink.spike.FinderSync
        INFOPLIST_FILE: FinderExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExt/FinderExt.entitlements
