name: Release

# `pnpm release` (release-it, run on the maintainer's machine) bumps the version, updates
# CHANGELOG.md, commits, tags `vX.Y.Z` and pushes. The tag triggers this workflow:
#   - verify:         the tag matches the CLI version, CHANGELOG.md has its section, checks pass
#   - github-release: GitHub Release (notes = that CHANGELOG section) with the macOS binaries,
#                     installer and SHA256SUMS
# It does NOT publish to npm: that is a deliberate manual step on the maintainer's machine
# (`pnpm release` ends with it; `pnpm release:publish` repeats it). See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The npm package, the binaries and `r2fl --version` must agree on one version.
      - name: Tag matches the CLI version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      # The GitHub Release uses this section as its notes, so a tag without one is refused here.
      - name: CHANGELOG.md has an entry for this tag
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > /dev/null

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  github-release:
    needs: verify
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile

      - name: Build the release files
        run: sh scripts/package-release.sh "$RUNNER_TEMP/release"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/r2fl-darwin-arm64 \
            "$RUNNER_TEMP"/release/r2fl-darwin-x64 \
            "$RUNNER_TEMP"/release/r2fl-macos-support.tar.gz \
            "$RUNNER_TEMP"/release/install.sh \
            "$RUNNER_TEMP"/release/uninstall.sh \
            "$RUNNER_TEMP"/release/SHA256SUMS
