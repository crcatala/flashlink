name: Release

# Push a tag `vX.Y.Z` (X.Y.Z = the version in packages/cli/package.json) to release:
#   - github-release: GitHub Release with the macOS binaries, installer and SHA256SUMS
#   - npm-publish:    the `r2fl` package on npm (skipped with a warning without an NPM_TOKEN secret)
# See docs/PLAN.md ("Distributing the binary") and the README ("Releasing").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The npm package, the binaries and `r2fl --version` must agree on one version.
      - name: Tag matches the CLI version
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  github-release:
    needs: verify
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile

      - name: Build the release files
        run: sh scripts/package-release.sh "$RUNNER_TEMP/release"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/release/r2fl-darwin-arm64 \
            "$RUNNER_TEMP"/release/r2fl-darwin-x64 \
            "$RUNNER_TEMP"/release/r2fl-macos-support.tar.gz \
            "$RUNNER_TEMP"/release/install.sh \
            "$RUNNER_TEMP"/release/uninstall.sh \
            "$RUNNER_TEMP"/release/SHA256SUMS

  npm-publish:
    needs: verify
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # A secret cannot be tested in `if:`, so look at it in a step. Without it (a fork that only
      # wants the binaries) the publish is skipped, loudly.
      - name: Is NPM_TOKEN set?
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NPM_TOKEN is not set, so r2fl was not published to npm."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly (in packages/cli) builds and tests again before the upload.
      - name: Publish to npm
        if: steps.token.outputs.present == 'true'
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
